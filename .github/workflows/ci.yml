name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan and UBSan
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzzers
        run: |
          F="-g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined -Isource/svac3"
          clang $F tests/fuzz/fuzz_hls.c source/svac3/svac3_hls.c -o fuzz_hls
          clang $F tests/fuzz/fuzz_patch.c source/svac3/svac3_hls.c source/svac3/svac3_aec.c \
            source/svac3/svac3_patch.c source/svac3/svac3_recon.c source/svac3/svac3_loopfilter.c \
            source/svac3/svac3_inter.c source/svac3/svac3_dec.c \
            -o fuzz_patch
      - name: Fuzz the header parser for 60 s
        run: |
          mkdir -p corpus
          cp tests/streams/*.svac3 corpus/
          ./fuzz_hls -max_total_time=60 -max_len=65536 corpus
      - name: Fuzz the patch parser for 60 s
        run: |
          mkdir -p corpus_patch
          head -c 60000 tests/streams/cv608_synth_1080p_cbr2m.svac3 > corpus_patch/idr.svac3
          ./fuzz_patch -max_total_time=60 -max_len=65536 corpus_patch
